# PCO MCP Server — production stack for TrueNAS / Portainer.
#
# Two services on a shared private network:
#   - pco-mcp     : the FastAPI/MCP app. Listens on port 8011 INSIDE the
#                   Docker network only. Never exposed to the host. The
#                   Cloudflare Tunnel container is the only way in.
#   - cloudflared : Cloudflare Tunnel daemon. Holds an outbound TLS
#                   connection to Cloudflare; routes inbound HTTPS requests
#                   for pco-mcp.greenwoodbc.net to http://pco-mcp:8011.
#                   The hostname mapping lives in Cloudflare Zero Trust;
#                   the tunnel token alone is enough to identify the tunnel.
#
# Required env vars (set in Portainer's stack form, NOT in a .env file):
#   PCO_CLIENT_ID, PCO_CLIENT_SECRET
#   PCO_REDIRECT_URI=https://pco-mcp.greenwoodbc.net/auth/callback
#   PCO_SCOPES=services
#   ENCRYPTION_KEY (Fernet — do NOT change after first run)
#   SESSION_SECRET (random 48+ bytes)
#   ADMIN_USERNAME, ADMIN_PASSWORD  (enables /admin)
#   CLOUDFLARE_TUNNEL_TOKEN          (from Cloudflare Zero Trust dashboard)
#
# Required volume on the TrueNAS host:
#   /mnt/<pool>/apps/pco-mcp/db  (pre-create the dataset before deploying)
#
# Local development (no Cloudflare): see docker-compose.local.yml or run
# `uvicorn app.main:app --port 8000` directly with your local .env.

services:
  pco-mcp:
    build: .
    image: pco-mcp:latest
    container_name: pco-mcp
    volumes:
      # TrueNAS dataset at /mnt/Greenwood Storage/pco-mcp. Quoted because of
      # the space in the pool name; the dataset must exist BEFORE deploy.
      - "/mnt/Greenwood Storage/pco-mcp:/app/db"
    environment:
      # All interpolated from Portainer's stack env settings (or local .env
      # for dev). Don't quote — Portainer handles values containing spaces.
      PCO_CLIENT_ID: ${PCO_CLIENT_ID}
      PCO_CLIENT_SECRET: ${PCO_CLIENT_SECRET}
      PCO_REDIRECT_URI: ${PCO_REDIRECT_URI}
      PCO_SCOPES: ${PCO_SCOPES:-services}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SESSION_EXPIRY_DAYS: ${SESSION_EXPIRY_DAYS:-0}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    networks:
      - pco-mcp-net
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8011/health', timeout=5).status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: pco-mcp-cloudflared
    restart: unless-stopped
    # `tunnel run` with no name uses TUNNEL_TOKEN; --no-autoupdate prevents
    # the image from trying to overwrite itself at runtime.
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - pco-mcp-net
    depends_on:
      pco-mcp:
        condition: service_healthy

networks:
  pco-mcp-net:
    driver: bridge
